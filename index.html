<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ashwin Chauhan — Frontend engineer based in Bengaluru, India.">
  <meta name="author" content="Ashwin Chauhan">
  <title>Ashwin Chauhan</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="02700562-0c10-4f61-99a6-24938148c8a9"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script>
    // Prevent flash: set theme before page renders
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-row">
        <a href="/" class="site-title">ashwin chauhan</a>
        <div class="header-actions">
          <a href="https://margins.app/u/a6112421bde046238ddb942a6632084c" target="_blank" rel="noopener noreferrer" class="margins-name-link">margins</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">dark</button>
        </div>
      </div>
      <nav class="nav">
        <!-- <a href="writing.html">writing</a> -->
      </nav>
    </header>

    <main>
      <!-- MEDIA TABS -->
      <section class="section" id="media">
        <div class="tabs">
          <button class="tab active" data-tab="bookshelf">bookshelf</button>
          <button class="tab" data-tab="series">shows</button>
          <button class="tab" data-tab="movies">movies</button>
          <button class="tab" data-tab="blog">blog</button>
        </div>
        <div class="tab-panel active" id="bookshelf-content"></div>
        <div class="tab-panel" id="movies-content"></div>
        <div class="tab-panel" id="series-content"></div>
        <div class="tab-panel" id="blog-content"></div>
      </section>
    </main>


  </div>

  <script>
    function trackEvent(name, data) {
      if (window.umami && typeof window.umami.track === 'function') {
        window.umami.track(name, data);
      }
    }

    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    
    function updateToggleText() {
      const isDark = html.getAttribute('data-theme') === 'dark';
      toggle.textContent = isDark ? 'light' : 'dark';
    }
    
    updateToggleText();
    
    toggle.addEventListener('click', () => {
      const isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      updateToggleText();
      trackEvent('theme_toggle', { theme: html.getAttribute('data-theme') || 'light' });
    });

    // TMDB API functions
    const posterCache = {};
    
    async function searchTMDB(title, mediaType) {
      const cacheKey = `${mediaType}:${title}`;
      if (posterCache[cacheKey]) {
        return posterCache[cacheKey];
      }

      try {
        const searchUrl = `${TMDB_CONFIG.baseUrl}/search/${mediaType}?api_key=${TMDB_CONFIG.apiKey}&query=${encodeURIComponent(title)}`;
        const response = await fetch(searchUrl);
        const data = await response.json();
        
        if (data.results && data.results.length > 0) {
          const posterPath = data.results[0].poster_path;
          if (posterPath) {
            const posterUrl = `${TMDB_CONFIG.imageBaseUrl}${posterPath}`;
            posterCache[cacheKey] = posterUrl;
            return posterUrl;
          }
        }
      } catch (error) {
        console.error(`Error fetching poster for ${title}:`, error);
      }
      
      return null;
    }

    async function searchOpenLibrary(title, olid) {
      const cacheKey = `book:${olid || title}`;
      if (posterCache[cacheKey]) {
        return posterCache[cacheKey];
      }

      try {
        if (olid) {
          const editionUrl = `https://openlibrary.org/books/${olid}.json`;
          const editionRes = await fetch(editionUrl);
          const edition = await editionRes.json();
          const result = {};
          if (edition.covers && edition.covers.length > 0 && edition.covers[0] > 0) {
            result.cover = `https://covers.openlibrary.org/b/id/${edition.covers[0]}-L.jpg`;
          }
          if (edition.authors && edition.authors.length > 0) {
            const authorRes = await fetch(`https://openlibrary.org${edition.authors[0].key}.json`);
            const author = await authorRes.json();
            result.author = author.name;
          }
          posterCache[cacheKey] = result;
          return result;
        }

        const searchUrl = `https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&fields=title,author_name,cover_i&limit=1`;
        const response = await fetch(searchUrl);
        const data = await response.json();

        if (data.docs && data.docs.length > 0) {
          const book = data.docs[0];
          const result = {};
          if (book.cover_i) {
            result.cover = `https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg`;
          }
          if (book.author_name && book.author_name.length > 0) {
            result.author = book.author_name[0];
          }
          posterCache[cacheKey] = result;
          return result;
        }
      } catch (error) {
        console.error(`Error fetching book info for ${title}:`, error);
      }

      return null;
    }

    // Media rendering with TMDB integration
    async function renderMedia(type, containerId) {
      try {
        const response = await fetch(`data/${type}.json`);
        const data = await response.json();
        const container = document.getElementById(containerId);
        
        if (!data || data.length === 0) {
          container.innerHTML = '<p class="empty-state">Nothing here yet...</p>';
          return;
        }
        
        // Render placeholder first
        let html = '';
        data.forEach(yearGroup => {
          if (yearGroup.items.length === 0) return;
          
          html += `
            <div class="year-group">
              <h3 class="year">${yearGroup.year}</h3>
              <ul class="items" id="${type}-${yearGroup.year}">
          `;
          
          yearGroup.items.forEach((item, index) => {
            const itemId = `${type}-${yearGroup.year}-${index}`;
            // Default placeholder or manual cover if no API fetch happens yet
            const initialCover = item.cover 
              ? `<img src="${item.cover}" alt="${item.title}" class="item-cover" loading="lazy">` 
              : `<div class="item-cover" style="background-color: var(--color-border);"></div>`;

            const seasonTag = item.seasons
              ? `<span class="item-seasons">${item.seasons === 'all' ? 'all seasons' : 'seasons: ' + item.seasons.join(', ')}${item.episode ? ' (' + item.episode + ')' : ''}</span>`
              : '';

            const authorTag = item.author
              ? `<span class="item-author">${item.author}</span>`
              : '';

            const partialMark = item.partial
              ? `<span class="item-partial" title="read more than 50%, not finished">*</span>`
              : '';

            html += `
              <li class="item" id="${itemId}">
                ${initialCover}
                <span class="item-title">${item.title}${partialMark}</span>
                ${seasonTag}
                ${authorTag}
              </li>
            `;
          });
          
          html += `
              </ul>
            </div>
          `;
        });

        const hasPartial = data.some(yearGroup => yearGroup.items.some(item => item.partial));
        if (hasPartial) {
          html += `<p class="legend">* read more than 50%, not finished</p>`;
        }

        container.innerHTML = html;
        
        // Fetch posters asynchronously
        for (const yearGroup of data) {
          for (let i = 0; i < yearGroup.items.length; i++) {
            const item = yearGroup.items[i];
            const itemId = `${type}-${yearGroup.year}-${i}`;
            const itemEl = document.getElementById(itemId);
            
            if (itemEl) {
              if (item.type === 'book') {
                const bookInfo = await searchOpenLibrary(item.title, item.olid);
                const finalPoster = bookInfo && bookInfo.cover;

                if (finalPoster) {
                  const currentCover = itemEl.querySelector('.item-cover');
                  if (currentCover.getAttribute('src') !== finalPoster) {
                    const img = document.createElement('img');
                    img.src = finalPoster;
                    img.alt = item.title;
                    img.className = 'item-cover';
                    img.loading = 'lazy';
                    currentCover.replaceWith(img);
                  }
                }

                if (bookInfo && bookInfo.author && !itemEl.querySelector('.item-author')) {
                  const authorSpan = document.createElement('span');
                  authorSpan.className = 'item-author';
                  authorSpan.textContent = bookInfo.author;
                  itemEl.appendChild(authorSpan);
                }
              } else {
                const mediaType = item.type || (type === 'series' ? 'tv' : 'movie');
                const posterUrl = await searchTMDB(item.title, mediaType);

                const finalPoster = posterUrl || item.cover;

                if (finalPoster) {
                  const currentCover = itemEl.querySelector('.item-cover');
                  if (currentCover.getAttribute('src') !== finalPoster) {
                    const img = document.createElement('img');
                    img.src = finalPoster;
                    img.alt = item.title;
                    img.className = 'item-cover';
                    img.loading = 'lazy';
                    currentCover.replaceWith(img);
                  }
                }
              }
            }
          }
        }
      } catch (error) {
        console.error(`Error loading ${type}:`, error);
        document.getElementById(containerId).innerHTML = '<p class="empty-state">Failed to load content.</p>';
      }
    }
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.tab}-content`).classList.add('active');
        trackEvent('section_view', { section: tab.dataset.tab });
      });
    });

    document.querySelectorAll('a[target="_blank"]').forEach(link => {
        link.addEventListener('click', () => {
          trackEvent('outbound_link', { destination: link.hostname });
        });
    });

    window.addEventListener('load', () => {
        trackEvent('section_view', { section: 'bookshelf' });
    });

    // Blog rendering (posts grouped by year, newest first)
    async function renderBlog(containerId) {
      const container = document.getElementById(containerId);
      try {
        const response = await fetch('data/blog.json');
        const data = await response.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="empty-state">Nothing here yet...</p>';
          return;
        }

        let html = '';
        data.forEach(yearGroup => {
          if (!yearGroup.items || yearGroup.items.length === 0) return;

          html += `
            <div class="year-group">
              <h3 class="year">${yearGroup.year}</h3>
              <ul class="blog-list">
          `;

          yearGroup.items.forEach(post => {
            const dateTag = post.date
              ? `<span class="blog-date">${post.date}</span>`
              : '';
            const titleEl = post.url
              ? `<a href="${post.url}" class="blog-link">${post.title}</a>`
              : `<span class="blog-link">${post.title}</span>`;

            html += `
              <li class="blog-item">
                ${titleEl}
                ${dateTag}
              </li>
            `;
          });

          html += `
              </ul>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (error) {
        console.error('Error loading blog:', error);
        container.innerHTML = '<p class="empty-state">Failed to load content.</p>';
      }
    }

    // Load all media sections
    renderMedia('bookshelf', 'bookshelf-content');
    renderMedia('movies', 'movies-content');
    renderMedia('series', 'series-content');
    renderBlog('blog-content');
  </script>
</body>
</html>
